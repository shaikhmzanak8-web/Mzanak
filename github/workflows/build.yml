name: Build Mzanak APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          if [ -f mzanak.zip ]; then unzip -o mzanak.zip; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle assembleRelease --no-daemon --console=plain
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk Mzanak.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mzanak v${{ github.run_number }}
          files: Mzanak.apk
